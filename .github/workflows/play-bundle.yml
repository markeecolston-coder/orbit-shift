name: Prepare unsigned Play bundle
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: orbit
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci
      - run: npm test
      - name: Build ad-disabled unsigned bundle for release preparation
        run: |
          npm run android:prepare
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-shift-UNSIGNED-not-uploadable-to-Play
          path: orbit/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
